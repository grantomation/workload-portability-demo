---
- name: Deploy Faux LB to Podman with ConfigMap and TLS Secret
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    app_dir: "{{ playbook_dir }}/.."
    image_name: "localhost/faux-lb:latest"

  tasks:
    - name: Find certificate directories
      ansible.builtin.find:
        paths: "{{ app_dir }}/letsencrypt/live"
        file_type: directory
      register: live_dirs

    - name: Validate that certificates directory exists
      ansible.builtin.assert:
        that: live_dirs.matched > 0
        fail_msg: >
          No certificate directories found in {{ app_dir }}/letsencrypt/live/.
          Place your TLS certs there before deploying (see README.md).

    - name: Set certs directory
      ansible.builtin.set_fact:
        certs_dir: "{{ live_dirs.files[0].path }}"

    - name: Ensure certificates exist
      ansible.builtin.stat:
        path: "{{ certs_dir }}/{{ item }}"
      register: cert_files
      loop:
        - fullchain.pem
        - privkey.pem
      failed_when: not cert_files.stat.exists

    - name: Read certificates
      ansible.builtin.slurp:
        src: "{{ certs_dir }}/{{ item }}"
      register: cert_data
      loop:
        - fullchain.pem
        - privkey.pem

    - name: Generate secret.yaml
      ansible.builtin.copy:
        dest: "{{ app_dir }}/secret.yaml"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: faux-lb-tls
          type: kubernetes.io/tls
          data:
            tls.crt: {{ cert_data.results[0].content }}
            tls.key: {{ cert_data.results[1].content }}
        mode: "0600"

    - name: Generate deployment.yaml (Pod Definition)
      ansible.builtin.copy:
        dest: "{{ app_dir }}/deployment.yaml"
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: faux-lb
          spec:
            containers:
              - name: dashboard
                image: {{ image_name }}
                ports:
                  - containerPort: 80
                    hostPort: 80
                  - containerPort: 443
                    hostPort: 443
                  - containerPort: 8080
                    hostPort: 8080
                volumeMounts:
                  - name: config-volume
                    mountPath: /app/config.yaml
                    subPath: config.yaml
                  - name: tls-certs
                    mountPath: /etc/nginx/certs
                    readOnly: true
            volumes:
              - name: config-volume
                configMap:
                  name: faux-lb-config
              - name: tls-certs
                secret:
                  secretName: faux-lb-tls
        mode: "0644"

    - name: Tear down existing Podman deployment (if any)
      ansible.builtin.command: podman play kube --down {{ app_dir }}/deployment.yaml
      failed_when: false
      changed_when: false

    - name: Deploy to Podman (Secret + ConfigMap + Pod)
      ansible.builtin.command: >
        podman play kube
        {{ app_dir }}/secret.yaml
        {{ app_dir }}/configmap.yaml
        {{ app_dir }}/deployment.yaml
      register: play_output
      changed_when: true

    - name: Show output
      ansible.builtin.debug:
        var: play_output.stdout_lines

    - name: Check if /etc/hosts entry exists
      ansible.builtin.command: "{{ app_dir }}/hosts.sh status"
      register: hosts_check
      changed_when: false

    - name: Add /etc/hosts entries for local DNS
      ansible.builtin.command: "{{ app_dir }}/hosts.sh add"
      register: hosts_output
      changed_when: "'Added' in hosts_output.stdout"
      become: true
      when: "'Not in' in hosts_check.stdout"

    - name: Show hosts status
      ansible.builtin.debug:
        msg: "{{ hosts_output.stdout_lines | default(hosts_check.stdout_lines) }}"
