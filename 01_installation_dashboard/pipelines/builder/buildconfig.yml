apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: golden-builder
spec:
  output:
    to:
      kind: ImageStreamTag
      name: golden-builder:latest
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  triggers:
    - type: ConfigChange
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: golden-builder
