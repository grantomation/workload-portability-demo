apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-image-exists
  annotations:
    description: "Verifies that a container image exists in the internal registry. Fails with a clear message if not found."
spec:
  params:
    - name: image
      type: string
      description: "Image stream tag to check (e.g. golden-builder:latest)"
    - name: namespace
      type: string
      default: "workload-portability-build"
    - name: produced-by
      type: string
      description: "Which pipeline produces this image (shown in the error message)"
  steps:
    - name: check
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        IMAGE="$(params.image)"
        NS="$(params.namespace)"
        PRODUCER="$(params.produced-by)"

        echo ">>> Checking dependency: ${IMAGE} in namespace ${NS}..."

        if oc get imagestreamtag "${IMAGE}" -n "${NS}" > /dev/null 2>&1; then
          echo ">>> OK: ${IMAGE} exists."
        else
          echo ""
          echo "============================================================"
          echo "  DEPENDENCY MISSING: ${IMAGE}"
          echo ""
          echo "  This image does not exist in the ${NS} namespace."
          echo "  It is produced by: ${PRODUCER}"
          echo ""
          echo "  Run that pipeline first, then re-run this one."
          echo "============================================================"
          echo ""
          exit 1
        fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-builder-image
  annotations:
    description: "Builds the golden-builder image (Fedora 44 + guestfs-tools + qemu-img) used by the build-golden-vm task"
spec:
  workspaces:
    - name: source
  params:
    - name: image-registry
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/workload-portability-build"
  steps:
    - name: build-and-push
      image: registry.access.redhat.com/ubi9/buildah:latest
      securityContext:
        privileged: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        REGISTRY="$(params.image-registry)"
        IMAGE="${REGISTRY}/golden-builder:latest"
        echo ">>> Building golden-builder image..."
        cd "$(workspaces.source.path)/01_installation_dashboard/pipelines/builder"
        buildah bud --tls-verify=false -t "${IMAGE}" -f Containerfile .
        echo ">>> Pushing to internal registry..."
        buildah push --tls-verify=false "${IMAGE}"
        echo ">>> Builder image pushed: ${IMAGE}"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-migration-components-image
  annotations:
    description: >-
      Downloads the Migration Components tarball from the artifact server, builds a container
      image containing the extracted libraries, pushes it to the internal
      registry, and grants pull access so any namespace can use it.
spec:
  params:
    - name: namespace
      type: string
      default: "workload-portability-build"
    - name: image-registry
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/workload-portability-build"
  results:
    - name: image-url
      description: "Full image URL for the Migration Components init image"
  volumes:
    - name: artifacts-pvc
      persistentVolumeClaim:
        claimName: wp-artifacts
  steps:
    - name: build-and-push
      image: registry.access.redhat.com/ubi9/buildah:latest
      securityContext:
        privileged: true
      volumeMounts:
        - name: artifacts-pvc
          mountPath: /artifacts
          readOnly: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS="$(params.namespace)"
        REGISTRY="$(params.image-registry)"
        IMAGE="${REGISTRY}/migration-components:latest"

        echo "==================================================="
        echo "  BUILD Migration Components IMAGE"
        echo "==================================================="

        # 1. Find the Migration Components tarball on the artifacts PVC
        echo "[Migration Components] Looking for Migration Components tarball on artifacts PVC..."
        ARCHIVE_COUNT=0
        TARBALL=""
        while IFS= read -r -d '' ARCHIVE; do
            ARCHIVE_COUNT=$((ARCHIVE_COUNT + 1))
            TARBALL="${ARCHIVE}"
        done < <(find /artifacts -maxdepth 1 -name '*.tar.gz' -type f -print0)
        if [ "${ARCHIVE_COUNT}" -eq 0 ]; then
            echo "[FAIL] No *.tar.gz archive found. Upload one compatible component archive first."
            exit 1
        fi
        if [ "${ARCHIVE_COUNT}" -ne 1 ]; then
            echo "[FAIL] Multiple *.tar.gz archives found. Leave only the intended component archive before building."
            exit 1
        fi
        echo "[Migration Components] Found: ${TARBALL} ($(du -h "${TARBALL}" | cut -f1))"

        # 2. Preserve the complete archive tree in an isolated build payload.
        # No supplier-specific directory names or archive layout are assumed.
        BUILD_DIR=$(mktemp -d)
        mkdir "${BUILD_DIR}/payload"
        echo "[Migration Components] Extracting tarball..."
        tar -xzf "${TARBALL}" -C "${BUILD_DIR}/payload" --no-same-owner --no-same-permissions
        if [ -z "$(find "${BUILD_DIR}/payload" -mindepth 1 -print -quit)" ]; then
            echo "[FAIL] Component archive is empty"
            exit 1
        fi

        # 3. Copy all supplied files and directories into the runtime destination.
        # The payload stays separate from this generated build recipe.
        printf '%s\n' \
          'FROM registry.access.redhat.com/ubi8/ubi-minimal' \
          'COPY payload/ /migration-components/' \
          'ENTRYPOINT ["cp", "-a", "/migration-components/.", "/opt/"]' \
          > "${BUILD_DIR}/Containerfile"

        # 4. Build
        echo "[Migration Components] Building image..."
        cd "${BUILD_DIR}"
        buildah bud --tls-verify=false -t "${IMAGE}" -f Containerfile .

        # 5. Push
        echo "[Migration Components] Pushing to internal registry..."
        buildah push --tls-verify=false "${IMAGE}"
        echo "[Migration Components] Image pushed: ${IMAGE}"

        # 6. Grant pull access to all authenticated users
        echo "[Migration Components] Granting image pull access..."
        printf '%s' "${IMAGE}" > "$(results.image-url.path)"

        rm -rf "${BUILD_DIR}"
        echo "[Migration Components] Done"
    - name: grant-pull-access
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS="$(params.namespace)"
        REGISTRY="$(params.image-registry)"
        IMAGE="${REGISTRY}/migration-components:latest"
        echo "[Migration Components] Granting image pull access to all service accounts..."
        oc policy add-role-to-group system:image-puller system:serviceaccounts -n "${NS}" 2>/dev/null || true
        oc policy add-role-to-group system:image-puller system:authenticated -n "${NS}" 2>/dev/null || true
        echo "[Migration Components] Any namespace can now pull from ${NS}"

        # Provider configuration is managed by the user through MTV.

        echo ""
        echo "==================================================="
        echo "  Migration Components IMAGE READY"
        echo "  ${IMAGE}"
        echo "==================================================="
    - name: restart-artifact-server
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS="$(params.namespace)"
        # The buildah step mounts the artifacts PVC with privileged/no SELinux
        # label, which uses Recursive relabeling and breaks the artifact server's
        # MountOption-based access. Restarting forces a clean remount.
        if oc get deployment artifacts -n "${NS}" &>/dev/null; then
          echo "[Migration Components] Restarting artifact server to restore PVC access..."
          oc rollout restart deployment/artifacts -n "${NS}"
          oc rollout status deployment/artifacts -n "${NS}" --timeout=120s
          echo "[Migration Components] Artifact server restarted."
        else
          echo "[Migration Components] No artifact server deployment — skipping restart."
        fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-management-ca
  annotations:
    description: >-
      Best-effort: reads the Legacy Infra cluster from the dashboard secret, downloads
      the management server CA certificate, and writes it to the artifacts PVC. If no Legacy Infra
      cluster exists, the URL is wrong, or the download fails, the task logs a
      warning and exits successfully — it never fails the pipeline.
spec:
  params:
    - name: namespace
      type: string
      default: "workload-portability-build"
    - name: clusters-secret
      type: string
      default: "installation-dashboard-clusters"
  volumes:
    - name: artifacts-pvc
      persistentVolumeClaim:
        claimName: wp-artifacts
  steps:
    - name: fetch
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      volumeMounts:
        - name: artifacts-pvc
          mountPath: /artifacts
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        NS="$(params.namespace)"
        SECRET="$(params.clusters-secret)"
        DEST="/artifacts/management-ca.crt"

        echo "==================================================="
        echo "  FETCH MANAGEMENT CA CERTIFICATE (best-effort)"
        echo "==================================================="
        echo ""

        # 1. Read clusters secret
        echo "[VCERT] Reading clusters from secret ${SECRET}..."
        CLUSTERS_B64=$(oc get secret "${SECRET}" -n "${NS}" -o jsonpath='{.data.clusters}' 2>&1) || {
            echo "[VCERT] SKIP: Could not read clusters secret: ${CLUSTERS_B64}"
            echo "[VCERT] No Legacy Infra cluster configured — skipping"
            exit 0
        }

        if [ -z "${CLUSTERS_B64}" ]; then
            echo "[VCERT] SKIP: Clusters secret is empty"
            exit 0
        fi

        # 2. Find Legacy Infra cluster and extract management server hostname
        echo "[VCERT] Looking for Legacy Infra cluster..."
        MANAGEMENT_URL=$(echo "${CLUSTERS_B64}" | base64 -d 2>/dev/null \
            | python3 -c "import sys,json;[print(c['managementUrl']) for c in json.load(sys.stdin).values() if c.get('type')=='legacy' and c.get('managementUrl')]" 2>/dev/null | head -1)

        if [ -z "${MANAGEMENT_URL}" ]; then
            echo "[VCERT] SKIP: No Legacy Infra cluster found in dashboard config"
            exit 0
        fi
        echo "[VCERT] Found management server URL: ${MANAGEMENT_URL}"

        # 3. Extract hostname from URL
        MANAGEMENT_HOST=$(echo "${MANAGEMENT_URL}" | sed -E 's|^https?://||' | cut -d'/' -f1 | cut -d':' -f1)
        if [ -z "${MANAGEMENT_HOST}" ]; then
            echo "[VCERT] SKIP: Could not extract hostname from URL"
            exit 0
        fi
        echo "[VCERT] management server host: ${MANAGEMENT_HOST}"

        # 4. Download certs bundle
        CERT_URL="https://${MANAGEMENT_HOST}/certs/download.zip"
        echo "[VCERT] Downloading ${CERT_URL}..."
        TMPDIR=$(mktemp -d)
        if ! curl -sk --max-time 30 -o "${TMPDIR}/download.zip" "${CERT_URL}" 2>&1; then
            echo "[VCERT] SKIP: Could not download certs from ${CERT_URL}"
            echo "[VCERT] management server may be unreachable or the URL may be wrong"
            rm -rf "${TMPDIR}"
            exit 0
        fi

        if [ ! -s "${TMPDIR}/download.zip" ]; then
            echo "[VCERT] SKIP: Downloaded file is empty"
            rm -rf "${TMPDIR}"
            exit 0
        fi
        echo "[VCERT] Downloaded $(du -h "${TMPDIR}/download.zip" | cut -f1)"

        # 5. Extract CA certificate
        echo "[VCERT] Extracting certificates..."
        if ! python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "${TMPDIR}/download.zip" "${TMPDIR}/certs" 2>&1; then
            echo "[VCERT] SKIP: Could not unzip certificate bundle"
            rm -rf "${TMPDIR}"
            exit 0
        fi

        # Find ALL CA certs and concatenate them into one bundle
        BUNDLE="${TMPDIR}/ca-bundle.pem"
        : > "${BUNDLE}"
        COUNT=0
        for SEARCH in "${TMPDIR}/certs/certs/lin/"*.0 "${TMPDIR}/certs/certs/lin/"*.crt "${TMPDIR}/certs/"*.0 "${TMPDIR}/certs/"*.crt; do
            if [ -f "${SEARCH}" ] 2>/dev/null; then
                if openssl x509 -in "${SEARCH}" -noout -subject 2>/dev/null; then
                    SUBJECT=$(openssl x509 -in "${SEARCH}" -noout -subject 2>/dev/null)
                    EXPIRY=$(openssl x509 -in "${SEARCH}" -noout -enddate 2>/dev/null)
                    echo "[VCERT] Found: $(basename "${SEARCH}") — ${SUBJECT}"
                    echo "[VCERT]   ${EXPIRY}"
                    cat "${SEARCH}" >> "${BUNDLE}"
                    COUNT=$((COUNT + 1))
                fi
            fi
        done

        if [ "${COUNT}" -eq 0 ]; then
            echo "[VCERT] SKIP: Could not find any CA certificates in downloaded bundle"
            echo "[VCERT] Contents:"
            find "${TMPDIR}/certs" -type f 2>/dev/null | head -20 | sed 's/^/  /'
            rm -rf "${TMPDIR}"
            exit 0
        fi
        echo "[VCERT] Found ${COUNT} CA certificate(s)"

        # 7. Copy bundle to artifacts PVC
        cp "${BUNDLE}" "${DEST}"
        echo "[VCERT] Written to ${DEST} ($(du -h "${DEST}" | cut -f1))"

        rm -rf "${TMPDIR}"
        echo ""
        echo "[VCERT] Done — management server CA certificate is available on the artifacts PVC"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-artifact-server
  annotations:
    description: "Builds the artifact server container image (Node.js file server with upload support)"
spec:
  workspaces:
    - name: source
  params:
    - name: image-registry
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/workload-portability-build"
  steps:
    - name: build-and-push
      image: registry.access.redhat.com/ubi9/buildah:latest
      securityContext:
        privileged: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        REGISTRY="$(params.image-registry)"
        IMAGE="${REGISTRY}/artifact-server:latest"
        echo ">>> Building artifact server image..."
        cd "$(workspaces.source.path)/03_artifact_server"
        buildah bud --tls-verify=false -t "${IMAGE}" -f Containerfile .
