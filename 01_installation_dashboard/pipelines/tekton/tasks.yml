apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-lb-config
  annotations:
    description: "Reads cluster data from the installation-dashboard-clusters Secret, logs into each OpenShift cluster to discover its apps domain, and generates a loadbalancer config ConfigMap."
spec:
  params:
    - name: namespace
      type: string
      default: "workload-portability-build"
  results:
    - name: apps-domain
      description: "The apps domain of the build cluster (for the loadbalancer Route)"
  steps:
    - name: generate
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS="$(params.namespace)"

        echo ">>> Reading cluster data from Secret..."
        CLUSTERS_JSON=$(oc get secret installation-dashboard-clusters -n "${NS}" -o jsonpath='{.data.clusters}' | base64 -d)

        echo ">>> Discovering build cluster apps domain..."
        BUILD_APPS_DOMAIN=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}')
        echo "Build cluster apps domain: ${BUILD_APPS_DOMAIN}"
        printf "%s" "${BUILD_APPS_DOMAIN}" > "$(results.apps-domain.path)"

        echo ">>> Generating loadbalancer config..."
        CONFIG="title: \"Application LB\"\ninitialActive: 1\ndomain: \"portable-workload.${BUILD_APPS_DOMAIN}\"\n\nnodes:\n"

        SORTED=$(echo "${CLUSTERS_JSON}" | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        items = sorted(data.items(), key=lambda x: x[1].get('lbPosition', 999))
        for name, c in items:
            if c.get('excludeFromLb'):
                print(f'Skipping {name} (excludeFromLb)', file=sys.stderr)
                continue
            if 'acm' in c.get('assignedRoles', []):
                print(f'Skipping {name} (ACM hub)', file=sys.stderr)
                continue
            t = c.get('type', 'openshift')
            print(f'{name}\t{t}\t{json.dumps(c)}')
        ")

        POS=1
        while IFS=$'\t' read -r NAME TYPE CJSON; do
          [ -z "${NAME}" ] && continue

          if [ "${TYPE}" = "legacy" ]; then
            URL=$(echo "${CJSON}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('workloadUrl',''))")
            ICON="vm"
            echo "  Legacy Infra cluster '${NAME}' -> ${URL}"
          else
            API=$(echo "${CJSON}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('api',''))")
            USER=$(echo "${CJSON}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('user',''))")
            PASS=$(echo "${CJSON}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('password',''))")

            echo "  Logging into OpenShift cluster '${NAME}' at ${API}..."
            oc login --insecure-skip-tls-verify -u "${USER}" -p "${PASS}" "${API}" > /dev/null 2>&1 || {
              echo "  WARNING: Could not log into ${NAME}, skipping"
              continue
            }
            APPS_DOMAIN=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}')
            URL="https://portable-workload-vm.${APPS_DOMAIN}"
            ICON="cloud"
            echo "  OpenShift cluster '${NAME}' -> ${URL}"
          fi

          CONFIG="${CONFIG}  - name: \"${NAME}\"\n    position: ${POS}\n    icon: ${ICON}\n    url: ${URL}\n\n"
          POS=$((POS + 1))
        done <<< "${SORTED}"

        echo ">>> Creating/updating ConfigMap faux-lb-config..."
        printf "${CONFIG}" > /tmp/config.yaml
        cat /tmp/config.yaml

        LOCAL_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        LOCAL_API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
        oc create configmap faux-lb-config --from-file=config.yaml=/tmp/config.yaml -n "${NS}" --dry-run=client -o yaml | \
          oc apply --server="${LOCAL_API}" --token="${LOCAL_TOKEN}" --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt -f - -n "${NS}"
        echo ">>> Config generation complete."
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-loadbalancer
  annotations:
    description: "Deploys the loadbalancer Deployment, Service, and Route on the build cluster."
spec:
  params:
    - name: namespace
      type: string
      default: "workload-portability-build"
    - name: image-registry
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/workload-portability-build"
    - name: apps-domain
      type: string
      description: "The build cluster apps domain for the Route host"
  steps:
    - name: deploy
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS="$(params.namespace)"
        REGISTRY="$(params.image-registry)"
        APPS_DOMAIN="$(params.apps-domain)"
        IMAGE="${REGISTRY}/faux-loadbalancer:latest"
        ROUTE_HOST="loadbalancer.${APPS_DOMAIN}"

        echo ">>> Deploying loadbalancer to ${NS}..."
        echo "    Image: ${IMAGE}"
        echo "    Route: ${ROUTE_HOST}"

        cat <<YAML | oc apply -f - -n "${NS}"
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: loadbalancer
          labels:
            app: loadbalancer
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: loadbalancer
          template:
            metadata:
              labels:
                app: loadbalancer
            spec:
              containers:
                - name: loadbalancer
                  image: ${IMAGE}
                  ports:
                    - containerPort: 8080
                  readinessProbe:
                    httpGet:
                      path: /api/state
                      port: 8080
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  volumeMounts:
                    - name: config
                      mountPath: /app/config.yaml
                      subPath: config.yaml
              volumes:
                - name: config
                  configMap:
                    name: faux-lb-config
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: loadbalancer
          labels:
            app: loadbalancer
        spec:
          selector:
            app: loadbalancer
          ports:
            - port: 8080
              targetPort: 8080
        ---
        apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
          name: loadbalancer
          labels:
            app: loadbalancer
        spec:
          host: ${ROUTE_HOST}
          to:
            kind: Service
            name: loadbalancer
          port:
            targetPort: 8080
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
        ---
        apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
          name: portable-workload
          labels:
            app: loadbalancer
        spec:
          host: portable-workload.${APPS_DOMAIN}
          to:
            kind: Service
            name: loadbalancer
          port:
            targetPort: 8080
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
        YAML

        echo ">>> Restarting loadbalancer to pick up config changes..."
        oc rollout restart deployment/loadbalancer -n "${NS}"
        oc rollout status deployment/loadbalancer -n "${NS}" --timeout=120s

        echo ">>> Loadbalancer deployed at https://${ROUTE_HOST}"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: onboard-clusters-to-acm
  annotations:
    description: "Reads cluster data from the installation-dashboard-clusters Secret, identifies the ACM hub cluster, and imports all other OpenShift clusters as ManagedClusters via auto-import."
spec:
  params:
    - name: namespace
      type: string
      default: "workload-portability-build"
  results:
    - name: summary
      description: "Summary of onboarding results"
  steps:
    - name: onboard
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS="$(params.namespace)"
        LOCAL_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        LOCAL_API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
        LOCAL_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        update_status() {
          echo "${1}" > /tmp/acm-status.json
          oc create configmap acm-onboard-status --from-file=status=/tmp/acm-status.json -n "${NS}" --dry-run=client -o yaml | \
            oc apply --server="${LOCAL_API}" --token="${LOCAL_TOKEN}" --certificate-authority="${LOCAL_CA}" -f - -n "${NS}"
        }

        echo ">>> Reading cluster data from Secret..."
        CLUSTERS_JSON=$(oc get secret installation-dashboard-clusters -n "${NS}" \
          --server="${LOCAL_API}" --token="${LOCAL_TOKEN}" --certificate-authority="${LOCAL_CA}" \
          -o jsonpath='{.data.clusters}' | base64 -d)

        echo ">>> Finding ACM hub cluster..."
        HUB_INFO=$(echo "${CLUSTERS_JSON}" | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        for name, c in data.items():
            roles = c.get('assignedRoles', [])
            if 'acm' in roles and c.get('type', 'openshift') == 'openshift':
                print(f'{name}\t{c[\"api\"]}\t{c[\"user\"]}\t{c[\"password\"]}')
                sys.exit(0)
        print('NOT_FOUND')
        sys.exit(1)
        ")

        if [ "${HUB_INFO}" = "NOT_FOUND" ] || [ -z "${HUB_INFO}" ]; then
          echo "ERROR: No cluster with ACM role found"
          update_status '{"status":"failed","clusters":{},"message":"No cluster with ACM role found"}'
          printf "No ACM hub cluster found" > "$(results.summary.path)"
          exit 1
        fi

        IFS=$'\t' read -r HUB_NAME HUB_API HUB_USER HUB_PASS <<< "${HUB_INFO}"
        echo "Hub cluster: ${HUB_NAME} at ${HUB_API}"

        echo ">>> Logging into hub cluster..."
        oc login --insecure-skip-tls-verify -u "${HUB_USER}" -p "${HUB_PASS}" "${HUB_API}" > /dev/null 2>&1

        update_status '{"status":"running","clusters":{}}'

        echo ">>> Collecting spoke clusters..."
        SPOKES=$(echo "${CLUSTERS_JSON}" | python3 -c "
        import json, sys, re
        data = json.load(sys.stdin)
        hub = '${HUB_NAME}'
        platform_map = {
            'azure': 'Azure',
            'aws': 'Amazon',
            'gcp': 'Google',
            'baremetal': 'BareMetal',
            'none': 'Other',
        }
        bm_pattern = re.compile(r'bare\s*metal|on[\s-]*prem', re.IGNORECASE)
        for name, c in data.items():
            if name == hub:
                continue
            if c.get('type', 'openshift') != 'openshift':
                continue
            safe = name.lower().replace(' ', '-')
            safe = ''.join(ch if ch.isalnum() or ch == '-' else '' for ch in safe)
            safe = safe.strip('-')
            if bm_pattern.search(name):
                cloud = 'BareMetal'
            else:
                platform = c.get('platform', 'unknown').lower()
                cloud = platform_map.get(platform, 'Other')
            print(f'{name}\t{safe}\t{c[\"api\"]}\t{c[\"user\"]}\t{c[\"password\"]}\t{cloud}')
        ")

        IMPORTED=0
        SKIPPED=0
        FAILED=0
        TOTAL=0
        STATUS_JSON='{"status":"running","clusters":{'
        FIRST=true

        while IFS=$'\t' read -r ORIG_NAME SAFE_NAME SPOKE_API SPOKE_USER SPOKE_PASS CLOUD_LABEL; do
          [ -z "${ORIG_NAME}" ] && continue
          TOTAL=$((TOTAL + 1))

          echo ""
          echo ">>> Processing cluster: ${ORIG_NAME} (${SAFE_NAME})"

          # Update status: checking
          if [ "${FIRST}" = true ]; then
            STATUS_JSON="${STATUS_JSON}\"${ORIG_NAME}\":\"checking\""
            FIRST=false
          else
            STATUS_JSON="${STATUS_JSON},\"${ORIG_NAME}\":\"checking\""
          fi
          update_status "${STATUS_JSON}}}"

          # Re-login to hub before each check
          oc login --insecure-skip-tls-verify -u "${HUB_USER}" -p "${HUB_PASS}" "${HUB_API}" > /dev/null 2>&1

          # Check if ManagedCluster already exists and is healthy
          if oc get managedcluster "${SAFE_NAME}" > /dev/null 2>&1; then
            MC_AVAIL=$(oc get managedcluster "${SAFE_NAME}" -o jsonpath='{range .status.conditions[?(@.type=="ManagedClusterConditionAvailable")]}{.status}{end}' 2>/dev/null || echo "")
            if [ "${MC_AVAIL}" = "True" ]; then
              echo "  ${ORIG_NAME} already imported as ${SAFE_NAME}, healthy — skipping"
              SKIPPED=$((SKIPPED + 1))
              STATUS_JSON=$(echo "${STATUS_JSON}" | sed "s/\"${ORIG_NAME}\":\"checking\"/\"${ORIG_NAME}\":\"skipped\"/")
              update_status "${STATUS_JSON}}}"
              continue
            fi
            echo "  ${ORIG_NAME} exists as ${SAFE_NAME} but agent unavailable (status: ${MC_AVAIL:-empty}), re-importing..."
            oc delete managedcluster "${SAFE_NAME}" --wait=false 2>/dev/null || true
            oc delete namespace "${SAFE_NAME}" --wait=false 2>/dev/null || true
            echo "  Waiting for ManagedCluster deletion..."
            oc wait --for=delete managedcluster/"${SAFE_NAME}" --timeout=60s 2>/dev/null || true
          fi

          # Update status: importing
          STATUS_JSON=$(echo "${STATUS_JSON}" | sed "s/\"${ORIG_NAME}\":\"checking\"/\"${ORIG_NAME}\":\"importing\"/")
          update_status "${STATUS_JSON}}}"

          # Log into spoke to get a token
          echo "  Logging into spoke ${ORIG_NAME} at ${SPOKE_API}..."
          if ! oc login --insecure-skip-tls-verify -u "${SPOKE_USER}" -p "${SPOKE_PASS}" "${SPOKE_API}" > /dev/null 2>&1; then
            echo "  WARNING: Could not log into ${ORIG_NAME}, skipping"
            FAILED=$((FAILED + 1))
            STATUS_JSON=$(echo "${STATUS_JSON}" | sed "s/\"${ORIG_NAME}\":\"importing\"/\"${ORIG_NAME}\":\"failed\"/")
            update_status "${STATUS_JSON}}}"
            continue
          fi
          SPOKE_TOKEN=$(oc whoami -t)
          SPOKE_SERVER=$(oc whoami --show-server)

          # Switch back to hub
          oc login --insecure-skip-tls-verify -u "${HUB_USER}" -p "${HUB_PASS}" "${HUB_API}" > /dev/null 2>&1

          echo "  Creating namespace ${SAFE_NAME} on hub..."
          oc create namespace "${SAFE_NAME}" --dry-run=client -o yaml | oc apply -f - 2>/dev/null || true

          CLOUD="${CLOUD_LABEL:-Other}"
          echo "  Creating ManagedCluster ${SAFE_NAME} (cloud: ${CLOUD})..."
          cat <<MCYAML | oc apply -f -
        apiVersion: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        metadata:
          name: ${SAFE_NAME}
          labels:
            name: ${SAFE_NAME}
            cloud: ${CLOUD}
            vendor: OpenShift
        spec:
          hubAcceptsClient: true
        MCYAML

          echo "  Creating KlusterletAddonConfig..."
          cat <<KACYAML | oc apply -f -
        apiVersion: agent.open-cluster-management.io/v1
        kind: KlusterletAddonConfig
        metadata:
          name: ${SAFE_NAME}
          namespace: ${SAFE_NAME}
        spec:
          clusterName: ${SAFE_NAME}
          clusterNamespace: ${SAFE_NAME}
          clusterLabels:
            cloud: auto-import
            vendor: OpenShift
          applicationManager:
            enabled: true
          policyController:
            enabled: true
          searchCollector:
            enabled: true
          certPolicyController:
            enabled: true
          iamPolicyController:
            enabled: true
        KACYAML

          echo "  Creating auto-import-secret..."
          cat <<AISYAML | oc apply -f -
        apiVersion: v1
        kind: Secret
        metadata:
          name: auto-import-secret
          namespace: ${SAFE_NAME}
        type: Opaque
        stringData:
          server: ${SPOKE_SERVER}
          token: ${SPOKE_TOKEN}
        AISYAML

          echo "  ${ORIG_NAME} imported as ${SAFE_NAME}"
          IMPORTED=$((IMPORTED + 1))
          STATUS_JSON=$(echo "${STATUS_JSON}" | sed "s/\"${ORIG_NAME}\":\"importing\"/\"${ORIG_NAME}\":\"imported\"/")
          update_status "${STATUS_JSON}}}"

        done <<< "${SPOKES}"

        SUMMARY="${IMPORTED} imported, ${SKIPPED} skipped, ${FAILED} failed out of ${TOTAL} clusters"
        echo ""
        echo ">>> ACM onboarding complete: ${SUMMARY}"

        # Ensure the observability pull secret exists to silence warnings
        echo ">>> Ensuring observability pull secret exists..."
        oc login --insecure-skip-tls-verify -u "${HUB_USER}" -p "${HUB_PASS}" "${HUB_API}" > /dev/null 2>&1
        if ! oc get secret multiclusterhub-operator-pull-secret -n open-cluster-management-observability > /dev/null 2>&1; then
          oc create secret docker-registry multiclusterhub-operator-pull-secret \
            --docker-server=registry.redhat.io --docker-username=unused --docker-password=unused \
            -n open-cluster-management-observability 2>/dev/null && \
            echo "    Created placeholder pull secret" || \
            echo "    Observability namespace not found — skipping"
        else
          echo "    Pull secret already exists"
        fi

        if [ "${FAILED}" -gt 0 ]; then
          FINAL_STATUS="failed"
        else
          FINAL_STATUS="complete"
        fi
        update_status $(echo "${STATUS_JSON}}}" | sed "s/\"running\"/\"${FINAL_STATUS}\"/")

        printf "%s" "${SUMMARY}" > "$(results.summary.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: dash-px-license-activate
  annotations:
    description: "Reads PX license key from dashboard config and cluster list from clusters Secret, logs into each cluster with Portworx, and activates the license via pxctl."
spec:
  params:
    - name: namespace
      type: string
      default: "workload-portability-build"
  results:
    - name: summary
      description: "Summary of license activation results"
  steps:
    - name: activate
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS="$(params.namespace)"
        LOCAL_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        LOCAL_API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
        LOCAL_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        echo ">>> Reading license key from dashboard config..."
        CONFIG_JSON=$(oc get secret installation-dashboard-config -n "${NS}" \
          --server="${LOCAL_API}" --token="${LOCAL_TOKEN}" --certificate-authority="${LOCAL_CA}" \
          -o jsonpath='{.data.config}' | base64 -d)

        PX_KEY=$(echo "${CONFIG_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('pxLicenseKey',''))")
        if [ -z "${PX_KEY}" ]; then
          echo "ERROR: No Portworx license key configured in dashboard"
          printf "No license key configured" > "$(results.summary.path)"
          exit 1
        fi
        echo "License key found (${#PX_KEY} chars)"

        echo ">>> Reading cluster data from Secret..."
        CLUSTERS_JSON=$(oc get secret installation-dashboard-clusters -n "${NS}" \
          --server="${LOCAL_API}" --token="${LOCAL_TOKEN}" --certificate-authority="${LOCAL_CA}" \
          -o jsonpath='{.data.clusters}' | base64 -d)

        echo ">>> Finding clusters with Portworx role..."
        PX_CLUSTERS=$(echo "${CLUSTERS_JSON}" | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        for name, c in data.items():
            roles = c.get('assignedRoles', [])
            if 'portworx' in roles and c.get('type', 'openshift') == 'openshift':
                print(f'{name}\t{c[\"api\"]}\t{c[\"user\"]}\t{c[\"password\"]}')
        ")

        if [ -z "${PX_CLUSTERS}" ]; then
          echo "No clusters with Portworx role found"
          printf "No Portworx clusters found" > "$(results.summary.path)"
          exit 0
        fi

        SUCCEEDED=0
        SKIPPED=0
        FAILED=0
        SUMMARY=""

        while IFS=$'\t' read -r NAME API USER PASS; do
          echo ""
          echo "────────────────────────────────────────"
          echo "  Activating license on: ${NAME}"
          echo "  API: ${API}"
          echo "────────────────────────────────────────"

          if ! oc login --insecure-skip-tls-verify -u "${USER}" -p "${PASS}" "${API}" > /dev/null 2>&1; then
            echo "  SKIP: Failed to login to ${NAME}"
            SKIPPED=$((SKIPPED + 1))
            SUMMARY="${SUMMARY}${NAME}: login failed (skipped); "
            continue
          fi

          PX_POD=$(oc get pods -n portworx -l name=portworx -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -z "${PX_POD}" ]; then
            echo "  SKIP: No Portworx pods on ${NAME} — StorageCluster not deployed yet"
            SKIPPED=$((SKIPPED + 1))
            SUMMARY="${SUMMARY}${NAME}: no px pods (skipped); "
            continue
          fi

          LICENSE_STATUS=$(oc exec -n portworx "${PX_POD}" -c portworx -- \
            /opt/pwx/bin/pxctl license list 2>&1 || true)
          if echo "${LICENSE_STATUS}" | grep -qi "saas\|enterprise"; then
            echo "  SKIP: License already active on ${NAME}"
            SKIPPED=$((SKIPPED + 1))
            SUMMARY="${SUMMARY}${NAME}: already licensed (skipped); "
            continue
          fi

          echo "  Exec into ${PX_POD}..."
          if OUTPUT=$(oc exec -n portworx "${PX_POD}" -c portworx -- \
            /opt/pwx/bin/pxctl license activate saas --key "${PX_KEY}" 2>&1); then
            echo "  SUCCESS: ${OUTPUT}"
            SUCCEEDED=$((SUCCEEDED + 1))
            SUMMARY="${SUMMARY}${NAME}: ok; "
          else
            echo "  ERROR: ${OUTPUT}"
            FAILED=$((FAILED + 1))
            SUMMARY="${SUMMARY}${NAME}: failed; "
          fi
        done <<< "${PX_CLUSTERS}"

        echo ""
        echo ">>> Done: ${SUCCEEDED} succeeded, ${SKIPPED} skipped, ${FAILED} failed"
        printf "%s" "${SUCCEEDED} succeeded, ${SKIPPED} skipped, ${FAILED} failed. ${SUMMARY}" > "$(results.summary.path)"

        if [ "${FAILED}" -gt 0 ]; then
          exit 1
        fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-ocp-providers
  annotations:
    description: >-
      Creates MTV OpenShift providers for clusters with the virt role assigned.
      Idempotent — safe to re-run. Cleans up stale providers, creates a service
      account on each remote cluster, generates a fresh token, and creates the
      provider in the MTV namespace.
spec:
  params:
    - name: namespace
      type: string
      default: "workload-portability-build"
    - name: clusters-secret
      type: string
      default: "installation-dashboard-clusters"
    - name: mtv-namespace
      type: string
      default: "openshift-mtv"
  results:
    - name: summary
      description: "Summary of providers created"
  steps:
    - name: create-providers
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        NS="$(params.namespace)"
        SECRET="$(params.clusters-secret)"
        MTV_NS="$(params.mtv-namespace)"
        SA_NAME="forklift-migration"
        LABEL_KEY="app.kubernetes.io/managed-by"
        LABEL_VALUE="installation-dashboard"
        LABEL="${LABEL_KEY}=${LABEL_VALUE}"

        echo "==================================================="
        echo "  CREATE OPENSHIFT PROVIDERS FOR MTV"
        echo "==================================================="
        echo ""

        # 1. Read clusters secret
        echo "[PROV] Reading clusters from secret ${SECRET}..."
        CLUSTERS_B64=$(oc get secret "${SECRET}" -n "${NS}" -o jsonpath='{.data.clusters}' 2>&1) || {
            echo "[FAIL] Could not read clusters secret: ${CLUSTERS_B64}"
            exit 1
        }

        CLUSTERS_JSON=$(echo "${CLUSTERS_B64}" | base64 -d)

        # 2. Get local cluster API to skip it (already has "host" provider)
        LOCAL_API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
        echo "[PROV] Local cluster API: ${LOCAL_API}"

        # 3. Parse OpenShift clusters
        CLUSTER_LIST=$(echo "${CLUSTERS_JSON}" | python3 -c "
        import sys, json
        clusters = json.load(sys.stdin)
        for name, c in clusters.items():
            if c.get('type', 'openshift') == 'openshift' and 'virt' in c.get('assignedRoles', []):
                api = c.get('api', '').rstrip('/')
                user = c.get('user', '')
                password = c.get('password', '')
                print(f'{name}|{api}|{user}|{password}')
        ")

        if [ -z "${CLUSTER_LIST}" ]; then
            echo "[PROV] No OpenShift clusters with virt role found in config"
            printf "No clusters with virt role" > "$(results.summary.path)"
            exit 0
        fi

        # 4. Clean up stale managed providers (not "host", not "legacy infrastructure")
        echo "[PROV] Cleaning up stale managed providers..."
        EXISTING=$(oc get providers -n "${MTV_NS}" -l "${LABEL}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
        for P in ${EXISTING}; do
            echo "[PROV]   Deleting provider ${P}..."
            oc delete provider "${P}" -n "${MTV_NS}" --ignore-not-found=true 2>/dev/null || true
            oc delete secret "mtv-provider-${P}" -n "${MTV_NS}" --ignore-not-found=true 2>/dev/null || true
        done

        # 5. Write cluster list to file so we can loop without a subshell
        CLUSTER_FILE="/tmp/cluster-list.txt"
        echo "${CLUSTER_LIST}" > "${CLUSTER_FILE}"
        CREATED=0
        SKIPPED=0
        FAILED=0
        SUMMARY=""
        LOCAL_CLEAN=$(echo "${LOCAL_API}" | sed 's|/$||')
        SA_NS="default"

        while IFS='|' read -r NAME API USER PASSWORD; do
            [ -z "${NAME}" ] && continue

            echo ""
            echo "--- ${NAME} ---"
            echo "[PROV] API: ${API}"

            # Skip local cluster
            API_CLEAN=$(echo "${API}" | sed 's|/$||')
            if [ "${API_CLEAN}" = "${LOCAL_CLEAN}" ]; then
                echo "[PROV] SKIP: Local cluster (already has 'host' provider)"
                SKIPPED=$((SKIPPED + 1))
                continue
            fi

            # Login to remote cluster with temp kubeconfig
            REMOTE_KC="/tmp/kubeconfig-${NAME}"
            export KUBECONFIG="${REMOTE_KC}"

            echo "[PROV] Logging in as ${USER}..."
            if ! oc login "${API}" --username="${USER}" --password="${PASSWORD}" --insecure-skip-tls-verify=true 2>&1 | sed 's/^/  /'; then
                echo "[FAIL] Could not login to ${NAME}"
                FAILED=$((FAILED + 1))
                SUMMARY="${SUMMARY} ${NAME}:login-failed"
                unset KUBECONFIG
                rm -f "${REMOTE_KC}"
                continue
            fi

            # Create SA on remote cluster in default ns (always exists)
            echo "[PROV] Ensuring service account ${SA_NAME} on ${NAME}..."
            cat <<YAML | oc apply -f - 2>&1 | sed 's/^/  /'
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${SA_NAME}
          namespace: ${SA_NS}
          labels:
            ${LABEL_KEY}: ${LABEL_VALUE}
        YAML

            # Bind cluster-admin (idempotent)
            oc adm policy add-cluster-role-to-user cluster-admin -z "${SA_NAME}" -n "${SA_NS}" 2>&1 | sed 's/^/  /'

            # Generate fresh token (1 year)
            echo "[PROV] Generating token..."
            TOKEN=$(oc create token "${SA_NAME}" -n "${SA_NS}" --duration=8760h 2>&1)
            if [ $? -ne 0 ] || [ -z "${TOKEN}" ]; then
                echo "[FAIL] Could not create token on ${NAME}: ${TOKEN}"
                FAILED=$((FAILED + 1))
                SUMMARY="${SUMMARY} ${NAME}:token-failed"
                unset KUBECONFIG
                rm -f "${REMOTE_KC}"
                continue
            fi
            echo "[PROV] Token generated (${#TOKEN} chars)"

            # Switch back to local cluster
            unset KUBECONFIG
            rm -f "${REMOTE_KC}"

            # Create secret on local cluster
            PROVIDER_SECRET="mtv-provider-${NAME}"
            echo "[PROV] Creating secret ${PROVIDER_SECRET}..."
            cat <<YAML | oc apply -f - 2>&1 | sed 's/^/  /'
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${PROVIDER_SECRET}
          namespace: ${MTV_NS}
          labels:
            ${LABEL_KEY}: ${LABEL_VALUE}
        type: Opaque
        stringData:
          token: ${TOKEN}
          insecureSkipVerify: "true"
        YAML

            # Create provider on local cluster
            echo "[PROV] Creating provider ${NAME}..."
            cat <<YAML | oc apply -f - 2>&1 | sed 's/^/  /'
        apiVersion: forklift.konveyor.io/v1beta1
        kind: Provider
        metadata:
          name: ${NAME}
          namespace: ${MTV_NS}
          labels:
            ${LABEL_KEY}: ${LABEL_VALUE}
        spec:
          type: openshift
          url: ${API}
          secret:
            name: ${PROVIDER_SECRET}
            namespace: ${MTV_NS}
        YAML

            CREATED=$((CREATED + 1))
            SUMMARY="${SUMMARY} ${NAME}:ok"
            echo "[PROV] ${NAME} provider created"
        done < "${CLUSTER_FILE}"

        echo ""
        echo "==================================================="
        echo "  PROVIDERS COMPLETE"
        echo "  Created: ${CREATED}  Skipped: ${SKIPPED}  Failed: ${FAILED}"
        echo "==================================================="
        printf "%s" "${CREATED} created, ${SKIPPED} skipped, ${FAILED} failed.${SUMMARY}" > "$(results.summary.path)"

        if [ "${FAILED}" -gt 0 ]; then
          exit 1
        fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-mtv-target-routes
  annotations:
    description: >-
      Reads clusters from the installation-dashboard-clusters secret, derives
      the apps domain from each non-Legacy Infra cluster's API URL, logs into each
      cluster, and creates routes for ALL clusters in portable-workload so
      Portworx namespace migration carries routes to every destination.
      Idempotent — safe to re-run.
spec:
  params:
    - name: namespace
      type: string
      default: "workload-portability-build"
    - name: clusters-secret
      type: string
      default: "installation-dashboard-clusters"
    - name: target-namespace
      type: string
      default: "portable-workload"
  results:
    - name: summary
      description: "Summary of routes created"
  steps:
    - name: create-routes
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        NS="$(params.namespace)"
        SECRET="$(params.clusters-secret)"
        TARGET_NS="$(params.target-namespace)"
        LOCAL_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        LOCAL_API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
        LOCAL_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        echo "==================================================="
        echo "  CREATE MTV TARGET ROUTES"
        echo "==================================================="
        echo ""

        # 1. Read clusters secret from the build cluster
        echo "[ROUTE] Reading clusters from secret ${SECRET}..."
        CLUSTERS_B64=$(oc get secret "${SECRET}" -n "${NS}" \
          --server="${LOCAL_API}" --token="${LOCAL_TOKEN}" --certificate-authority="${LOCAL_CA}" \
          -o jsonpath='{.data.clusters}' 2>&1) || {
            echo "[FAIL] Could not read clusters secret: ${CLUSTERS_B64}"
            exit 1
        }

        CLUSTERS_JSON=$(echo "${CLUSTERS_B64}" | base64 -d)

        # 2. Parse ALL OpenShift clusters with credentials
        ALL_CLUSTERS=$(echo "${CLUSTERS_JSON}" | python3 -c "
        import sys, json
        clusters = json.load(sys.stdin)
        for name, c in sorted(clusters.items()):
            if c.get('type', 'openshift') == 'legacy':
                continue
            api = c.get('api', '')
            user = c.get('user', '')
            password = c.get('password', '')
            print(f'{name}|{api}|{user}|{password}')
        ")

        # 3. Parse only MTV clusters (clusters to log into)
        CLUSTER_LIST=$(echo "${CLUSTERS_JSON}" | python3 -c "
        import sys, json
        clusters = json.load(sys.stdin)
        for name, c in sorted(clusters.items()):
            if c.get('type', 'openshift') == 'legacy':
                continue
            if 'mtv' not in c.get('assignedRoles', []):
                continue
            api = c.get('api', '')
            user = c.get('user', '')
            password = c.get('password', '')
            print(f'{name}|{api}|{user}|{password}')
        ")

        if [ -z "${CLUSTER_LIST}" ]; then
            echo "[ROUTE] No clusters with MTV role found"
            printf "No MTV clusters found" > "$(results.summary.path)"
            exit 0
        fi

        # 4. Query each cluster's real apps domain and build route definitions
        ROUTE_FILE="/tmp/all-routes.txt"
        CLUSTER_FILE="/tmp/cluster-list.txt"
        echo "${CLUSTER_LIST}" > "${CLUSTER_FILE}"

        > "${ROUTE_FILE}"
        echo "${ALL_CLUSTERS}" | while IFS='|' read -r NAME API USER PASS; do
            [ -z "${NAME}" ] && continue
            APPS_DOMAIN=""
            if oc login --insecure-skip-tls-verify -u "${USER}" -p "${PASS}" "${API}" > /dev/null 2>&1; then
                APPS_DOMAIN=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}' 2>/dev/null || echo "")
            fi
            if [ -z "${APPS_DOMAIN}" ]; then
                APPS_DOMAIN=$(echo "${API}" | python3 -c "from urllib.parse import urlparse; import re,sys; print(re.sub(r'^api\.', 'apps.', urlparse(sys.stdin.read().strip()).hostname or ''))")
                echo "[ROUTE] WARNING: Could not query ${NAME}, falling back to: ${APPS_DOMAIN}"
            else
                echo "[ROUTE] ${NAME}: ${APPS_DOMAIN}"
            fi
            echo "${NAME}|portable-workload-vm-${NAME}|portable-workload-vm.${APPS_DOMAIN}" >> "${ROUTE_FILE}"
        done

        echo "[ROUTE] Routes to create on each cluster:"
        cat "${ROUTE_FILE}" | while IFS='|' read -r _ RNAME RHOST; do
            echo "  ${RNAME} -> ${RHOST}"
        done

        # 5. Log into each MTV cluster and create ALL routes
        CLUSTERS_OK=0
        CLUSTERS_FAIL=0
        TOTAL_CREATED=0
        TOTAL_FAILED=0

        while IFS='|' read -r NAME API USER PASS APPS_DOMAIN; do
            [ -z "${NAME}" ] && continue

            echo ""
            echo "==========================================="
            echo "  Cluster: ${NAME}"
            echo "==========================================="

            echo "[ROUTE] Logging into ${NAME} at ${API}..."
            if ! oc login --insecure-skip-tls-verify -u "${USER}" -p "${PASS}" "${API}" > /dev/null 2>&1; then
                echo "[FAIL] Could not log into ${NAME}, skipping"
                CLUSTERS_FAIL=$((CLUSTERS_FAIL + 1))
                continue
            fi

            # Ensure target namespace exists on this cluster
            if ! oc get namespace "${TARGET_NS}" > /dev/null 2>&1; then
                echo "[ROUTE] Creating namespace ${TARGET_NS} on ${NAME}..."
                oc create namespace "${TARGET_NS}" 2>&1 || true
            fi

            # Create all routes on this cluster
            while IFS='|' read -r CNAME ROUTE_NAME ROUTE_HOST; do
                [ -z "${CNAME}" ] && continue

                if cat <<YAML | oc apply -f - 2>&1 | sed 's/^/    /'; then
        apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
          name: ${ROUTE_NAME}
          namespace: ${TARGET_NS}
          labels:
            app: portable-workload
            app.kubernetes.io/managed-by: installation-dashboard
        spec:
          host: ${ROUTE_HOST}
          to:
            kind: Service
            name: pw-frontend-svc
          port:
            targetPort: http
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
        YAML
                    TOTAL_CREATED=$((TOTAL_CREATED + 1))
                    echo "  [OK] ${ROUTE_NAME}"
                else
                    TOTAL_FAILED=$((TOTAL_FAILED + 1))
                    echo "  [FAIL] ${ROUTE_NAME}"
                fi
            done < "${ROUTE_FILE}"

            CLUSTERS_OK=$((CLUSTERS_OK + 1))
            echo "[ROUTE] ${NAME} done"
        done < "${CLUSTER_FILE}"

        echo ""
        echo "==================================================="
        echo "  ROUTES COMPLETE"
        echo "  Clusters: ${CLUSTERS_OK} ok, ${CLUSTERS_FAIL} failed"
        echo "  Routes: ${TOTAL_CREATED} created, ${TOTAL_FAILED} failed"
        echo "==================================================="
        printf "%s" "${CLUSTERS_OK} clusters, ${TOTAL_CREATED} routes created, ${TOTAL_FAILED} failed" > "$(results.summary.path)"

        if [ "${TOTAL_FAILED}" -gt 0 ]; then
          exit 1
        fi
