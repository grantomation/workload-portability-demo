apiVersion: v1
kind: Secret
metadata:
  name: thanos-object-storage
  namespace: open-cluster-management-observability
type: Opaque
stringData:
  thanos.yaml: |
    type: s3
    config:
      bucket: {{config.s3.bucket}}
      endpoint: {{config.s3.endpoint}}
      insecure: false
      access_key: {{config.s3.accessKey}}
      secret_key: {{config.s3.secretKey}}
