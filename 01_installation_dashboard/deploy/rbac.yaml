apiVersion: v1
kind: ServiceAccount
metadata:
  name: installation-dashboard
  namespace: workload-portability-build
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"installation-dashboard"}}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: installation-dashboard
  namespace: workload-portability-build
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: installation-dashboard
  namespace: workload-portability-build
subjects:
  - kind: ServiceAccount
    name: installation-dashboard
    namespace: workload-portability-build
roleRef:
  kind: Role
  name: installation-dashboard
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: read-ingress-config
rules:
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: installation-dashboard-read-ingress
subjects:
  - kind: ServiceAccount
    name: installation-dashboard
    namespace: workload-portability-build
roleRef:
  kind: ClusterRole
  name: read-ingress-config
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipeline-read-ingress
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: workload-portability-build
roleRef:
  kind: ClusterRole
  name: read-ingress-config
  apiGroup: rbac.authorization.k8s.io
