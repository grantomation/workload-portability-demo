# SOURCE: https://install.portworx.com/3.6?operator=true&mc=false&kbver=1.34.0&ns=portworx&b=true&kvdbtls=true&certmgr=true&iop=6&s=%22type%3Dgp3%2Csize%3D150%22&md=type%3Dgp3%2Csize%3D64&ce=aws&dmthin=true&r=17001&c=px-cluster-560fb582-46e6-4d7b-a400-be501d56937a&eks=true&osft=true&nopxproxy=true&stork=true&csi=true&mon=true&aut=true&tel=true&st=k8s&promop=true
kind: StorageCluster
apiVersion: core.libopenstorage.org/v1
metadata:
  name: px-cluster-560fb582-46e6-4d7b-a400-be501d56937a
  namespace: portworx
  annotations:
    portworx.io/install-source: "https://install.portworx.com/3.6?operator=true&mc=false&kbver=1.34.0&ns=portworx&b=true&kvdbtls=true&certmgr=true&iop=6&s=%22type%3Dgp3%2Csize%3D150%22&md=type%3Dgp3%2Csize%3D64&ce=aws&dmthin=true&r=17001&c=px-cluster-560fb582-46e6-4d7b-a400-be501d56937a&eks=true&osft=true&nopxproxy=true&stork=true&csi=true&mon=true&aut=true&tel=true&st=k8s&promop=true"
    portworx.io/is-openshift: "true"
    portworx.io/is-eks: "true"
    portworx.io/misc-args: " -T px-storev2 "
    portworx.io/preflight-check: "true"
    portworx.io/portworx-proxy: "false"
    portworx.io/service-type: "portworx-api:LoadBalancer"
spec:
  image: docker.io/portworx/oci-monitor:3.6.2
  imagePullPolicy: Always
  kvdb:
    internal: true
    enableTLS: true
  cloudStorage:
    deviceSpecs:
    - type=gp3,size=150
    systemMetadataDeviceSpec: type=gp3,size=64
  secretsProvider: k8s
  startPort: 17001
  stork:
    enabled: true
    args:
      webhook-controller: "true"
      admin-namespace: "portworx"
  autopilot:
    enabled: true
  runtimeOptions:
    default-io-profile: "6"
  csi:
    enabled: true
  monitoring:
    telemetry:
      enabled: true
    prometheus:
      enabled: true
      exportMetrics: true
  certManager:
    enabled: true
  env:
