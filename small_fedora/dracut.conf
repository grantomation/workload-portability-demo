# Generic (not host-only) initramfs: the image is built in a container and must
# boot on legacy infrastructure first, then on OpenShift CNV after an MTV raw copy.
hostonly="no"
compress="zstd"

# The initramfs only has to find and mount the root disk. virtio_blk, virtio_pci,
# ahci, sd_mod, ext4 and btrfs are built into Fedora's kernel; these are the
# storage drivers that are modules. `drivers` is EXCLUSIVE — nothing else is added.
# (No LSI Logic / mptsas in kernel-modules-core: legacy infrastructure must use PVSCSI, SATA or NVMe.)
drivers=" virtio_scsi vmw_pvscsi nvme "

omit_dracutmodules+=" plymouth nfs iscsi multipath lvm mdraid crypt dmraid dm network network-manager i18n "
omit_dracutmodules+=" fips fips-crypto-policies openssl systemd-pcrphase systemd-battery-check systemd-ask-password "
omit_dracutmodules+=" nvdimm lunmask resume virtiofs hwdb kernel-modules-extra qemu terminfo "
